name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Add a `strategy.matrix.crystal` block here (and use `${{ matrix.crystal }}`
      # below) to test more than one Crystal release.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            lib
            ~/.cache/shards
          key: ${{ runner.os }}-crystal-${{ hashFiles('shard.yml') }}
          restore-keys: |
            ${{ runner.os }}-crystal-

      - name: Install dependencies
        run: shards install

      - name: Build tools
        run: make tools

      - name: Build
        run: make build

      - name: Format
        run: make format

      - name: Lint
        run: make lint

      - name: Test
        run: make test
