name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0

      - name: Install dependencies
        run: shards install

      - name: Build
        run: make build

      - name: Format
        run: make format

      - name: Lint
        run: make lint

      - name: Test
        run: make test
